[build-system]
requires = ["setuptools<82"]
build-backend = "setuptools.build_meta"

[project]
name = "prospero"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "evodiff>=1.1.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "scikit-learn>=1.8.0",
    "setuptools<82",
    "tape-proteins",
    "torch==2.5.1",
    "tqdm>=4.67.3",
    "transformers>=5.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
